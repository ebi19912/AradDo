
services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: araddodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d araddodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: ./services/auth_service
      dockerfile: ../../Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/araddodb
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app_network

  task_service:
    build:
      context: ./services/task_service
      dockerfile: ../../Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@postgres_db:5432/araddodb
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app_network

  api_gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - task_service
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
